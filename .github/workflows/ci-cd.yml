name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/python-api
    env:
      STUDYHUB_ENV: "test"
      STUDYHUB_NO_DOTENV: "1"
      STUDYHUB_DB_MODE: "sqlite"
      STUDYHUB_AI_PROVIDER: "local"
      STUDYHUB_API_RATE_LIMIT_PER_MINUTE: "120"
      STUDYHUB_API_BURST: "30"
      STUDYHUB_AUTH_RATE_LIMIT_PER_MINUTE: "10"
      STUDYHUB_AUTH_BURST: "5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/python-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show safe test configuration
        run: |
          echo "Environment: ${STUDYHUB_ENV}"
          echo "Database: ${STUDYHUB_DB_MODE} (configured)"
          echo "Rate limit: enabled (api=${STUDYHUB_API_RATE_LIMIT_PER_MINUTE}/minute, burst=${STUDYHUB_API_BURST})"
          echo "AI provider mode: ${STUDYHUB_AI_PROVIDER}"

      - name: Run backend tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          PYTHONPATH=.:backend python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ai-studyhub-api.onrender.com/api' }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
