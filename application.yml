server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/studyhub_db
    username: postgres
    password: rootpassword # Thay bằng mật khẩu bạn chọn lúc cài PostgreSQL
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect