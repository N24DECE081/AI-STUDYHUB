services:
  - type: web
    name: ai-studyhub-api
    runtime: python
    plan: free
    rootDir: apps/python-api
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: STUDYHUB_NO_DOTENV
        value: "1"
      - key: STUDYHUB_SECURE_COOKIES
        value: "1"
      - key: STUDYHUB_ENV
        value: production
      - key: STUDYHUB_CORS_ORIGINS
        value: https://ai-studyhub-phi.vercel.app
      - key: STUDYHUB_FRONTEND_URL
        value: https://ai-studyhub-phi.vercel.app
      - key: STUDYHUB_AI_PROVIDER
        value: openai
      - key: STUDYHUB_AI_MODEL
        value: gpt-4o
      - key: STUDYHUB_AI_TASK_MODEL
        value: gpt-4o-mini
      - key: STUDYHUB_AI_API_KEY
        sync: false
      - key: STUDYHUB_SEED_DEMO_USERS
        value: "1"
      - key: STUDYHUB_ADMIN_EMAILS
        value: phantienvy130920026@gmail.com,admin@studyhub.local,phantienvy13092006@gmail.com
